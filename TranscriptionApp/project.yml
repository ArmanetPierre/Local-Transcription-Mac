name: TranscriptionApp
options:
  bundleIdPrefix: com.pierre
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.40"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_LANGUAGE: en

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  TranscriptionApp:
    type: application
    platform: macOS
    sources:
      - TranscriptionApp
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pierre.Voxa
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_CFBundleDisplayName: Voxa
        CODE_SIGN_ENTITLEMENTS: TranscriptionApp/Resources/TranscriptionApp.entitlements
        ENABLE_APP_SANDBOX: false
        PRODUCT_NAME: Voxa
        GENERATE_INFOPLIST_FILE: true
        # Cles Sparkle (les INFOPLIST_KEY_ personnalisees sont ignorees par Xcode)
        INFOPLIST_FILE: TranscriptionApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Voxa uses the microphone to record your voice during meetings."
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: false
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "4"

  TranscriptionAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TranscriptionAppTests
    dependencies:
      - target: TranscriptionApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pierre.Voxa.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Voxa.app/Contents/MacOS/Voxa"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: false

schemes:
  TranscriptionApp:
    build:
      targets:
        TranscriptionApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TranscriptionAppTests
    archive:
      config: Release
